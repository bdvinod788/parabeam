[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parabeam"
version = "0.1.0"
description = "Scaling PRM-guided beam search across GPUs with asynchronous work stealing"
readme = "README.md"
requires-python = ">=3.11,<3.15"

# Lets vLLM serve the PRM with prefix caching; see parabeam/backends/vllm_prm.py.
[project.entry-points."vllm.general_plugins"]
parabeam_prm = "parabeam.backends.vllm_plugin:register"

[tool.setuptools.packages.find]
include = ["parabeam*"]

[tool.setuptools.package-data]
"parabeam.eval" = ["*.json"]
"parabeam.backends" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
